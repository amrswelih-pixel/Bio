<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مساعدة المتحدث</title>

<style>
body{
    margin:0;
    font-family:Tahoma, Arial;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
    text-align:center;
}

/* شاشة البداية */
#start{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-size:48px;
    font-weight:bold;
}

/* الشاشات */
.screen{
    display:none;
    padding:25px;
    animation:fade 0.7s ease;
}

@keyframes fade{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}

h2{
    font-size:28px;
}

/* الأزرار */
button{
    width:90%;
    max-width:400px;
    padding:15px;
    margin:10px auto;
    border:none;
    border-radius:12px;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    background:#00c6ff;
    color:white;
    transition:0.3s;
    display:block;
}

button:hover{
    background:#0072ff;
    transform:scale(1.05);
}

.role{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:8px auto;
    max-width:450px;
    background:rgba(255,255,255,0.1);
    padding:10px 15px;
    border-radius:10px;
    font-size:18px;
}

input[type="checkbox"]{
    width:20px;
    height:20px;
}

.close-btn{
    background:#ff4b5c;
}

.confirm-btn{
    background:#28a745;
}
</style>
</head>

<body>

<div id="start">
مساعدة المتحدث
</div>

<div id="main" class="screen">
    <h2>القائمة الرئيسية</h2>
    <button onclick="showScreen('laws')">قوانين لعبة مافيا</button>
    <button onclick="showScreen('roles')">الادوار</button>
    <button onclick="showScreen('punishments')">العقابات</button>
</div>

<div id="laws" class="screen">
    <h2>العقابات :</h2>
    <p style="font-size:20px;">عقاب النظر بالليل : حرق ليلتين</p>
    <p style="font-size:20px;">عقاب الكلام بالليل : منع استخدام القدرة الليلة القادمة</p>
    <button class="close-btn" onclick="back()">إغلاق</button>
</div>

<div id="punishments" class="screen">
    <h2>العقابات :</h2>
    <p style="font-size:20px;">عقاب النظر بالليل : حرق ليلتين</p>
    <p style="font-size:20px;">عقاب الكلام بالليل : منع استخدام القدرة الليلة القادمة</p>
    <button class="close-btn" onclick="back()">إغلاق</button>
</div>

<div id="roles" class="screen">
    <h2>ترتيب ادوار اللعبة :</h2>

    <div id="rolesList"></div>

    <button class="confirm-btn" onclick="confirmRoles()">تأكيد</button>
    <button class="close-btn" onclick="back()">إغلاق</button>
</div>

<div id="result" class="screen">
    <h2>الأدوار المختارة :</h2>
    <div id="selectedRoles" style="font-size:20px;"></div>
    <button class="close-btn" onclick="back()">إغلاق</button>
</div>

<script>

let roles = [
"الحارس","المضاعف","المرآة","الدرع","الصدى","الناسخ",
"المراوغ","العلامه","حامل السر","السم الخفي",
"المافيا (الاثنين)","الطبيب","المحقق","القناص",
"المبشِّر","الحكيم الغامض","الناقل","الخلل"
];

let selected = [];

function showScreen(id){
    document.querySelectorAll('.screen').forEach(s=>s.style.display='none');
    document.getElementById(id).style.display='block';
}

function back(){
    document.querySelectorAll('.screen').forEach(s=>s.style.display='none');
    document.getElementById('main').style.display='block';
}

setTimeout(()=>{
    document.getElementById('start').style.display='none';
    document.getElementById('main').style.display='block';
},5000);

let container = document.getElementById("rolesList");

roles.forEach(role=>{
    let div = document.createElement("div");
    div.className="role";

    let span = document.createElement("span");
    span.textContent=role;

    let checkbox = document.createElement("input");
    checkbox.type="checkbox";
    checkbox.onchange=function(){
        if(this.checked){
            selected.push(role);
        }else{
            selected = selected.filter(r=>r!==role);
        }
    };

    div.appendChild(span);
    div.appendChild(checkbox);
    container.appendChild(div);
});

function confirmRoles(){
    if(selected.length===0){
        alert("لم يتم اختيار أي دور!");
        return;
    }

    showScreen('result');
    let resultDiv = document.getElementById("selectedRoles");
    resultDiv.innerHTML="";
    selected.forEach(role=>{
        let p=document.createElement("p");
        p.textContent=role;
        resultDiv.appendChild(p);
    });
}

</script>

</body>
</html>
