<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mafia Character Suggestion</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #0f172a, #020617);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
}

.container {
  width: 90%;
  max-width: 420px;
  text-align: center;
}

.fade-in { animation: fadeIn 1.5s ease forwards; }
.fade-out { animation: fadeOut 1.5s ease forwards; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-20px); } }

input, textarea {
  width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: none; font-size: 15px;
}
textarea { height: 90px; resize: none; }

button {
  margin-top: 15px; padding: 12px 25px; border: none; border-radius: 25px;
  background: #6366f1; color: white; font-size: 16px; cursor: pointer;
}
button:hover { background: #4f46e5; }

.lang-switch {
  position: absolute; top: 15px; right: 15px; background: transparent;
  border: 1px solid white; padding: 6px 12px; border-radius: 15px; font-size: 13px; color: white;
}

.hidden { display: none; }
</style>
</head>

<body>

<button class="lang-switch" onclick="toggleLang()">AR</button>

<div class="container">

  <!-- Welcome -->
  <div id="welcome" class="fade-in">
    <h1 id="welcomeText">Welcome!</h1>
    <p id="welcomeDesc">You can suggest a brand new character idea for a Mafia game.</p>
  </div>

  <!-- Form -->
  <div id="form" class="hidden fade-in">
    <input id="charName" placeholder="Character Name">
    <textarea id="charIdea" placeholder="Character Idea"></textarea>
    <button onclick="submitIdea()" id="doneBtn">Done!</button>
  </div>

  <!-- Summary -->
  <div id="summary" class="hidden fade-in">
    <h2 id="summaryTitle">Character Description</h2>
    <p id="summaryText"></p>
    <button onclick="showThanks()">Next</button>
  </div>

  <!-- Thanks -->
  <div id="thanks" class="hidden fade-in">
    <h1 id="thanksText">Thank you for suggesting a character!</h1>
    <button onclick="goToIdeas()" id="viewIdeasBtn">View All Suggestions</button>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-analytics.js";

// 🔹 Firebase Config الذي نسخته
const firebaseConfig = {
  apiKey: "AIzaSyBHcv-m6BlmYWu5b-IRm5huhMTmBH6Y4g0",
  authDomain: "mafiagameideas.firebaseapp.com",
  projectId: "mafiagameideas",
  storageBucket: "mafiagameideas.firebasestorage.app",
  messagingSenderId: "255476566447",
  appId: "1:255476566447:web:22f406cd69bee53246875a",
  measurementId: "G-9DMPBL1EXX"
};

const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const db = getFirestore(app);

window.sendToFirebase = async function(name, idea) {
  try {
    await addDoc(collection(db, "suggestions"), {
      name: name,
      idea: idea,
      createdAt: serverTimestamp()
    });
  } catch (e) {
    console.error("Firebase error:", e);
  }
};

let currentLang = "en";
const texts = {
  en: {
    welcomeText: "Welcome!",
    welcomeDesc: "You can suggest a brand new character idea for a Mafia game.",
    name: "Character Name",
    idea: "Character Idea",
    done: "Done!",
    summaryTitle: "Character Description",
    thanks: "Thank you for suggesting a character!",
    viewIdeas: "View All Suggestions"
  },
  ar: {
    welcomeText: "مرحباً!",
    welcomeDesc: "يمكنك اقتراح فكرة شخصية جديدة للعبة مافيا.",
    name: "اسم الشخصية",
    idea: "فكرة الشخصية",
    done: "انتهيت!",
    summaryTitle: "وصف الشخصية",
    thanks: "شكراً على اقتراح شخصية!",
    viewIdeas: "عرض جميع الاقتراحات"
  }
};

// Hide welcome after 10 seconds
setTimeout(() => {
  const w = document.getElementById("welcome");
  w.classList.add("fade-out");
  setTimeout(() => {
    w.style.display = "none";
    document.getElementById("form").classList.remove("hidden");
  }, 1500);
}, 10000);

function submitIdea() {
  const name = document.getElementById("charName").value.trim();
  const idea = document.getElementById("charIdea").value.trim();
  if (!name || !idea) return;

  // 🔹 إرسال الاقتراح إلى Firebase
  sendToFirebase(name, idea);

  document.getElementById("form").classList.add("hidden");
  const summary = currentLang === "en"
    ? `Meet ${name}, a unique character in the Mafia world. ${idea}`
    : `تعرف على ${name}، شخصية فريدة في عالم المافيا. ${idea}`;
  document.getElementById("summaryText").innerText = summary;
  document.getElementById("summary").classList.remove("hidden");
}

function showThanks() {
  document.getElementById("summary").classList.add("hidden");
  document.getElementById("thanks").classList.remove("hidden");

  // تحديث نص الزر حسب اللغة
  document.getElementById("viewIdeasBtn").innerText = texts[currentLang].viewIdeas;
}

// 🔹 دالة الانتقال إلى الموقع الثاني
function goToIdeas() {
  window.location.href = "ideas.html";
}

function toggleLang() {
  currentLang = currentLang === "en" ? "ar" : "en";
  const t = texts[currentLang];
  document.documentElement.lang = currentLang;
  document.body.style.direction = currentLang === "ar" ? "rtl" : "ltr";
  document.getElementById("welcomeText").innerText = t.welcomeText;
  document.getElementById("welcomeDesc").innerText = t.welcomeDesc;
  document.getElementById("charName").placeholder = t.name;
  document.getElementById("charIdea").placeholder = t.idea;
  document.getElementById("doneBtn").innerText = t.done;
  document.getElementById("summaryTitle").innerText = t.summaryTitle;
  document.getElementById("thanksText").innerText = t.thanks;
  document.getElementById("viewIdeasBtn").innerText = t.viewIdeas;
}
</script>

</body>
</html>
