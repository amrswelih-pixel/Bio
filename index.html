<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>لعبة المافيا</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
  margin:0;
  font-family:Arial;
  background:#020617;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.game{
  width:400px;
  background:#0f172a;
  border-radius:12px;
  padding:15px;
}
button{
  width:100%;
  padding:10px;
  margin-top:6px;
  border:none;
  border-radius:6px;
  background:#6366f1;
  color:white;
  cursor:pointer;
}
.log{
  background:#020617;
  height:180px;
  overflow:auto;
  margin-top:10px;
  padding:8px;
  font-size:14px;
}
</style>
</head>
<body>

<div class="game">
  <h3>🕵️ لعبة المافيا</h3>
  <button onclick="startGame()">🎭 بدء اللعبة</button>
  <button onclick="night()">🌙 ليل</button>
  <button onclick="day()">☀️ نهار (تصويت)</button>
  <div class="log" id="log"></div>
</div>

<script>
let players=["أحمد","محمد","علي","سارة","نور","خالد"];
let roles={}, alive=[], phase="نهار";

function log(t){
  let l=document.getElementById("log");
  l.innerHTML+=t+"<br>";
  l.scrollTop=l.scrollHeight;
}

function startGame(){
  roles={};
  alive=[...players];
  let s=[...players].sort(()=>Math.random()-0.5);
  roles[s[0]]="مافيا";
  roles[s[1]]="طبيب";
  roles[s[2]]="محقق";
  for(let i=3;i<s.length;i++) roles[s[i]]="مواطن";
  log("🎭 تم توزيع الأدوار");
}

function night(){
  if(alive.length<=2) return;
  phase="ليل";
  let victim=alive[Math.floor(Math.random()*alive.length)];
  alive=alive.filter(p=>p!==victim);
  log("🌙 الليل: تم قتل "+victim+" ("+roles[victim]+")");
  checkWin();
}

function day(){
  if(alive.length<=2) return;
  phase="نهار";
  let voted=alive[Math.floor(Math.random()*alive.length)];
  alive=alive.filter(p=>p!==voted);
  log("☀️ التصويت: خرج "+voted+" ("+roles[voted]+")");
  checkWin();
}

function checkWin(){
  let mafia=alive.filter(p=>roles[p]=="مافيا").length;
  let others=alive.length-mafia;
  if(mafia==0){
    log("🏆 فوز المواطنين!");
  }else if(mafia>=others){
    log("🏆 فوز المافيا!");
  }
}
</script>

</body>
</html>
