<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مساعدة المتحدث</title>

<style>
body{
    margin:0;
    font-family:Tahoma, Arial;
    background:linear-gradient(180deg,#0f2027,#203a43,#2c5364);
    color:white;
}

/* توسيط عام */
.center{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

/* شاشة البداية */
#start{
    height:100vh;
    font-size:52px;
    font-weight:bold;
    text-align:center;
}

/* الشاشات */
.screen{
    display:none;
    padding:30px 20px;
    min-height:100vh;
    animation:fade 0.5s ease;
}

@keyframes fade{
    from{opacity:0; transform:translateY(15px);}
    to{opacity:1; transform:translateY(0);}
}

h2{
    text-align:center;
    font-size:30px;
    margin-bottom:25px;
}

/* الأزرار */
button{
    width:100%;
    max-width:420px;
    padding:18px;
    margin:12px auto;
    border:none;
    border-radius:14px;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
    background:linear-gradient(45deg,#00c6ff,#0072ff);
    color:white;
    transition:0.25s;
    display:block;
}

button:active{
    transform:scale(0.97);
}

.close-btn{
    background:linear-gradient(45deg,#ff4b5c,#ff1e40);
}

.confirm-btn{
    background:linear-gradient(45deg,#28a745,#1e7e34);
}

/* الأدوار */
.role{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:10px auto;
    max-width:450px;
    background:rgba(255,255,255,0.12);
    padding:14px 18px;
    border-radius:12px;
    font-size:20px;
}

input[type="checkbox"]{
    width:22px;
    height:22px;
}

.text{
    font-size:22px;
    text-align:center;
    margin:15px 0;
}
</style>
</head>

<body>

<div id="start" class="center">
مساعدة المتحدث
</div>

<div id="main" class="screen center">
    <h2>القائمة الرئيسية</h2>
    <button onclick="showScreen('laws')">قوانين لعبة مافيا</button>
    <button onclick="showScreen('roles')">الادوار</button>
    <button onclick="showScreen('punishments')">العقابات</button>
</div>

<div id="laws" class="screen">
    <h2>العقابات</h2>
    <div class="text">عقاب النظر بالليل : حرق ليلتين</div>
    <div class="text">عقاب الكلام بالليل : منع استخدام القدرة الليلة القادمة</div>
    <button class="close-btn" onclick="back()">إغلاق</button>
</div>

<div id="punishments" class="screen">
    <h2>العقابات</h2>
    <div class="text">عقاب النظر بالليل : حرق ليلتين</div>
    <div class="text">عقاب الكلام بالليل : منع استخدام القدرة الليلة القادمة</div>
    <button class="close-btn" onclick="back()">إغلاق</button>
</div>

<div id="roles" class="screen">
    <h2>ترتيب ادوار اللعبة</h2>
    <div id="rolesList"></div>
    <button class="confirm-btn" onclick="confirmRoles()">تأكيد</button>
    <button class="close-btn" onclick="back()">إغلاق</button>
</div>

<div id="result" class="screen">
    <h2>الأدوار المختارة</h2>
    <div id="selectedRoles" class="text"></div>
    <button class="close-btn" onclick="back()">إغلاق</button>
</div>

<script>

let roles = [
"الحارس","المضاعف","المرآة","الدرع","الصدى","الناسخ",
"المراوغ","العلامه","حامل السر","السم الخفي",
"المافيا (الاثنين)","الطبيب","المحقق","القناص",
"المبشِّر","الحكيم الغامض","الناقل","الخلل"
];

let selected = [];

function showScreen(id){
    document.querySelectorAll('.screen').forEach(s=>s.style.display='none');
    document.getElementById(id).style.display='block';
    window.scrollTo(0,0);
}

function back(){
    document.querySelectorAll('.screen').forEach(s=>s.style.display='none');
    document.getElementById('main').style.display='flex';
    window.scrollTo(0,0);
}

setTimeout(()=>{
    document.getElementById('start').style.display='none';
    document.getElementById('main').style.display='flex';
},4000);

let container = document.getElementById("rolesList");

roles.forEach(role=>{
    let div = document.createElement("div");
    div.className="role";

    let span = document.createElement("span");
    span.textContent=role;

    let checkbox = document.createElement("input");
    checkbox.type="checkbox";
    checkbox.onchange=function(){
        if(this.checked){
            selected.push(role);
        }else{
            selected = selected.filter(r=>r!==role);
        }
    };

    div.appendChild(span);
    div.appendChild(checkbox);
    container.appendChild(div);
});

function confirmRoles(){
    if(selected.length===0){
        alert("لم يتم اختيار أي دور!");
        return;
    }

    showScreen('result');
    let resultDiv = document.getElementById("selectedRoles");
    resultDiv.innerHTML="";
    selected.forEach(role=>{
        let p=document.createElement("p");
        p.textContent=role;
        resultDiv.appendChild(p);
    });
}

</script>

</body>
</html>
